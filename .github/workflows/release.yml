name: release

# Push a tag like v0.2.0 (or run manually) to build the Paper and Hytale jars and
# publish them as a GitHub Release. Versions with a "-" (v0.2.0-beta.1) become pre-releases.
#
# The Hytale jar compiles against HytaleServer.jar, which is built from the private
# HypixelStudios/hytale-shared-source repo. Add a repository secret HYTALE_SOURCE_TOKEN
# (a token with read access to that repo). Without it, the release ships the Paper jar only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.2.0 (created from the selected branch if it doesn't exist)"
        required: true
      hytale-ref:
        description: "hytale-shared-source branch or tag to build against (default: its default branch)"
        required: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      HAS_HYTALE_TOKEN: ${{ secrets.HYTALE_SOURCE_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v5

      - name: Resolve version
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag '$TAG' must look like v1.2.3 or v1.2.3-beta.1"; exit 1
          fi
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      # --- Hytale server jar (only with HYTALE_SOURCE_TOKEN) ---------------------------

      - name: Check out Hytale server source
        if: env.HAS_HYTALE_TOKEN == 'true'
        uses: actions/checkout@v5
        with:
          repository: HypixelStudios/hytale-shared-source
          ref: ${{ github.event.inputs.hytale-ref }}
          token: ${{ secrets.HYTALE_SOURCE_TOKEN }}
          path: hytale-src
          fetch-depth: 1
          # The server build also reads a few files outside HytaleServer/; skip the ~4 GB of assets.
          sparse-checkout: |
            HytaleServer
            HytaleClient/Lib
            build
            HytaleAssets/Server/Languages

      - name: Record Hytale server revision
        if: env.HAS_HYTALE_TOKEN == 'true'
        run: echo "HYTALE_REV=$(git -C hytale-src rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache Hytale server jar
        if: env.HAS_HYTALE_TOKEN == 'true'
        id: hytale-jar
        uses: actions/cache@v4
        with:
          path: hytale-src/HytaleServer/dist/HytaleServer/HytaleServer.jar
          key: hytale-server-${{ env.HYTALE_REV }}

      - name: Cache Maven repository
        if: env.HAS_HYTALE_TOKEN == 'true' && steps.hytale-jar.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-${{ hashFiles('hytale-src/HytaleServer/**/pom.xml') }}
          restore-keys: maven-

      - name: Build Hytale server jar
        if: env.HAS_HYTALE_TOKEN == 'true' && steps.hytale-jar.outputs.cache-hit != 'true'
        working-directory: hytale-src/HytaleServer
        run: ./mvnw -B -q package -DskipTests -DskipStaticAnalysis

      - name: Point Gradle at the Hytale server jar
        if: env.HAS_HYTALE_TOKEN == 'true'
        run: echo "HYTALE_SERVER_JAR=$GITHUB_WORKSPACE/hytale-src/HytaleServer/dist/HytaleServer/HytaleServer.jar" >> "$GITHUB_ENV"

      - name: No Hytale token
        if: env.HAS_HYTALE_TOKEN != 'true'
        run: echo "::warning::HYTALE_SOURCE_TOKEN is not set; releasing the Paper jar only."

      # --- Build and release -----------------------------------------------------------

      - name: Build
        run: ./gradlew build -Pversion="$VERSION"

      - name: Collect jars
        run: |
          mkdir dist
          cp paper/build/libs/jev-guard-paper-"$VERSION".jar dist/
          if [[ -n "${HYTALE_SERVER_JAR:-}" ]]; then
            cp hytale/build/libs/jev-guard-hytale-"$VERSION".jar dist/
          fi
          (cd dist && sha256sum *.jar > SHA256SUMS.txt)
          ls -l dist

      - name: Write release notes header
        run: |
          {
            echo "## Downloads"
            echo
            echo "| Platform | File | Install |"
            echo "|---|---|---|"
            echo "| Minecraft (Paper/Folia 26.2+) | \`jev-guard-paper-$VERSION.jar\` | \`plugins/\` |"
            if [[ -n "${HYTALE_SERVER_JAR:-}" ]]; then
              echo "| Hytale | \`jev-guard-hytale-$VERSION.jar\` | \`mods/\` |"
            fi
            echo
            if [[ -n "${HYTALE_REV:-}" ]]; then
              echo "Hytale jar built against hytale-shared-source \`${HYTALE_REV:0:9}\`."
              echo
            fi
          } > notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--title "jev-guard $VERSION" --notes-file notes.md --generate-notes --verify-tag)
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" && git push origin "$TAG"
          fi
          gh release create "$TAG" dist/* "${flags[@]}"
